<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>台股量價雷達 V4</title>
<style>:root{--bg:#07111f;--card:#101d30;--line:#263851;--txt:#edf4ff;--muted:#9db0c9;--blue:#62a7ff;--green:#55d6a7;--yellow:#ffd166;--red:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:16px 13px 70px}h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}label{font-size:11px;color:var(--muted)}input,select,button{width:100%;margin-top:5px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#091525;color:var(--txt)}button{background:var(--blue);color:#04101e;border:0;font-weight:800}.presets{display:flex;gap:7px;overflow:auto;margin-top:10px}.presets button{min-width:max-content;background:#172942;color:var(--txt)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.tag{padding:4px 7px;border-radius:999px;background:#1a2c45}.bp{color:var(--yellow)}.up{color:var(--green)}.down{color:var(--red)}.why{white-space:normal;min-width:180px;text-align:left}.tabs{display:flex;gap:7px;margin-top:12px}.tabs button{background:#172942;color:var(--txt)}.tabs .on{background:var(--blue);color:#04101e}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.kpi{border:1px solid var(--line);border-radius:11px;padding:9px}.kpi b{display:block;margin-top:3px}.chart{height:360px;position:relative;background:#091525;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.chart{height:310px}}</style>
<style>
/* V4 mobile readability */
body{font-size:17px}
h1{font-size:32px;line-height:1.15}
.muted{font-size:14px;line-height:1.45}
.card{padding:18px}
label{font-size:15px}
label small,.en{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}
input,select,button{font-size:17px;min-height:50px;padding:13px}
.tabs button{font-size:17px}
table{font-size:15px}
th,td{padding:12px 9px}
.stockcell b{font-size:17px}
.stockname{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
@media(max-width:700px){
  .wrap{padding:20px 14px 90px}
  .card{border-radius:20px}
  .grid{grid-template-columns:1fr 1fr}
  .results-table thead{display:none}
  .results-table,.results-table tbody,.results-table tr,.results-table td{display:block;width:100%}
  .results-table tr{border:1px solid var(--line);border-radius:16px;margin:0 0 13px;padding:10px 12px;background:#0d1a2b}
  .results-table td{border:0;padding:7px 0;text-align:right;white-space:normal}
  .results-table td::before{content:attr(data-label);float:left;color:var(--muted);font-size:13px;font-weight:650;margin-right:10px}
  .results-table td.stockcell{text-align:left;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:4px}
  .results-table td.stockcell::before{display:none}
  .why{min-width:0;text-align:right}
}
</style>
</head><body><div class="wrap">
<h1>台股量價雷達 V4</h1><div class="muted">手機版 · 支撐 / 共振突破 / 壓力 / 量價型態</div>
<div class="tabs"><button id="tScan" class="on" onclick="tab('scan')">掃描</button><button id="tChart" onclick="tab('chart')">K線技術區</button><button id="tAlgo" onclick="tab('algo')">參數</button></div>
<section id="scan"><div class="card"><b>股票池 <span class='en'>Stock Pool</span></b><div class="presets"><button onclick="preset('focus')">目前關注</button><button onclick="preset('ai')">AI供應鏈</button><button onclick="preset('pcb')">PCB/ABF</button><button onclick="preset('server')">伺服器/散熱/電源</button></div><div class="grid" style="margin-top:10px">
<div><label>股票代號 <small>Stock codes</small></label><input id="symbols" value="2449,6274,2408,3037"></div><div><label>最低成交量 <small>Min volume</small></label><input id="minVol" type="number" value="3000"></div><div><label>最低量比 <small>Volume ratio</small></label><input id="minVR" type="number" step=".1" value="1"></div><div><label>距突破區最大距離 <small>Max BP distance</small></label><input id="maxBP" type="number" step=".5" value="5"></div><div><label>型態 <span class='en'>Pattern</span></label><select id="pat"><option value="">全部</option><option>突破前</option><option>突破確認</option><option>突破後回測</option><option>支撐反彈</option></select></div><div><label>20日均線 <span class='en'>MA20</span></label><select id="maf"><option value="">不限</option><option value="up">向上</option><option value="down">向下</option></select></div><div><label>FinMind 金鑰 <small>Token・選填</small></label><input id="token" type="password"></div><div><button onclick="scan()">開始掃描</button></div></div><div id="status" class="muted" style="margin-top:9px">準備就緒</div></div>
<div class="card scroll"><table><thead><tr><th>股票</th><th>現價</th><th>S1</th><th>S2</th><th>BP</th><th>R1</th><th>R2</th><th>量比</th><th>距BP</th><th>20日均線 <span class='en'>MA20</span></th><th>型態 <span class='en'>Pattern</span></th><th class="why">共振原因</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="chart" class="hidden"><div class="card"><div class="grid"><div><label>股票代號</label><input id="chartId" value="6274"></div><div><button onclick="chartLoad()">分析並畫圖</button></div></div></div><div class="card"><div id="ctitle"></div><div class="kpis" id="kpis" style="margin:10px 0"></div><div class="chart"><canvas id="cv" width="1100" height="430"></canvas></div><div id="cwhy" class="muted" style="margin-top:9px"></div></div></section>
<section id="algo" class="hidden"><div class="card"><div class="grid"><div><label>共振聚類 ±%</label><input id="tol" type="number" step=".1" value="1.5"></div><div><label>大量K：20日均量倍數</label><input id="bigv" type="number" step=".1" value="1.8"></div><div><label>波段高低權重</label><input id="ws" type="number" value="3"></div><div><label>大量K權重</label><input id="wb" type="number" value="3"></div><div><label>MA20權重</label><input id="w20" type="number" value="2"></div><div><label>MA60權重</label><input id="w60" type="number" value="2"></div></div><p class="muted">先用實際股票校正。後續可再加入平台上緣、成交密集區、籌碼與盤中訊號。</p></div></section></div>
<script>
const NAMES={"2449": "京元電子", "6274": "台燿", "2408": "南亞科", "3037": "欣興", "2382": "廣達", "3231": "緯創", "6669": "緯穎", "3017": "奇鋐", "2308": "台達電", "2376": "技嘉", "2356": "英業達", "3661": "世芯-KY", "3653": "健策", "2345": "智邦", "3035": "智原", "2368": "金像電", "8046": "南電", "3189": "景碩", "4958": "臻鼎-KY", "2383": "台光電"};
const API="https://api.finmindtrade.com/api/v4/data",C={}; const $=x=>document.getElementById(x),avg=a=>a.reduce((x,y)=>x+y,0)/a.length,fmt=n=>n==null?"—":(n>=1000?n.toFixed(0):n.toFixed(2).replace(/\.00$/,""));
const pools={focus:"2449,6274,2408,3037",ai:"2449,6274,2408,3037,2382,3231,6669,3017,2308,2376,2356,3661,3653,2345,3035,2368,8046",pcb:"3037,6274,8046,2368,3189,4958,2383",server:"2382,3231,6669,3017,2308,2376,2356"};
function preset(x){$("symbols").value=pools[x]}function tab(x){["scan","chart","algo"].forEach(y=>{$(y).classList.toggle("hidden",x!==y);$("t"+y[0].toUpperCase()+y.slice(1)).classList.toggle("on",x===y)})}
async function get(id){if(C[id])return C[id];let s=new Date();s.setDate(s.getDate()-230);let p=new URLSearchParams({dataset:"TaiwanStockPrice",data_id:id,start_date:s.toISOString().slice(0,10)}),h={};if($("token").value)h.Authorization="Bearer "+$("token").value;let r=await fetch(API+"?"+p,{headers:h});if(!r.ok)throw Error("API "+r.status);let j=await r.json();if(!j.data?.length)throw Error(j.msg||"無資料");return C[id]=j.data}
function clusters(p,t){p.sort((a,b)=>a.p-b.p);let o=[];for(const z of p){let c=o.at(-1);if(!c||Math.abs(z.p-c.mid)/c.mid>t)o.push({lo:z.p,hi:z.p,mid:z.p,score:z.w,reasons:[z.r]});else{c.lo=Math.min(c.lo,z.p);c.hi=Math.max(c.hi,z.p);c.mid=(c.lo+c.hi)/2;c.score+=z.w;c.reasons.push(z.r)}}return o}
function calc(raw){let d=raw.slice(-120),n=d.length,L=d.at(-1),close=+L.close,ma=k=>avg(d.slice(-k).map(x=>+x.close)),v20=avg(d.slice(-21,-1).map(x=>+x.Trading_Volume))/1000,vr=(+L.Trading_Volume/1000)/v20,p=[];
for(let i=3;i<n-3;i++){let q=d[i],hs=d.slice(i-3,i+4).map(x=>+x.max),ls=d.slice(i-3,i+4).map(x=>+x.min);if(+q.max===Math.max(...hs))p.push({p:+q.max,w:+$("ws").value,r:"波段高"});if(+q.min===Math.min(...ls))p.push({p:+q.min,w:+$("ws").value,r:"波段低"})}
let av=avg(d.slice(-21,-1).map(x=>+x.Trading_Volume));d.slice(-60).forEach(q=>{if(+q.Trading_Volume>av*+$("bigv").value){p.push({p:+q.max,w:+$("wb").value,r:"大量K高"},{p:+q.min,w:+$("wb").value,r:"大量K低"})}});p.push({p:ma(20),w:+$("w20").value,r:"MA20"},{p:ma(60),w:+$("w60").value,r:"MA60"});
let cs=clusters(p,+$("tol").value/100),below=cs.filter(z=>z.mid<close).sort((a,b)=>b.mid-a.mid),above=cs.filter(z=>z.mid>=close).sort((a,b)=>a.mid-b.mid),bp=above.find(z=>z.score>=4)||above[0],rr=bp?above.filter(z=>z.mid>bp.mid*1.01):above,dist=bp?(bp.lo-close)/close*100:null,pat="支撐反彈",near=below[0],m20=ma(20),mup=m20>avg(d.slice(-25,-5).map(x=>+x.close));
if(bp&&close<bp.lo&&dist<=3)pat="突破前";if(bp&&close>bp.hi&&vr>=1.3)pat="突破確認";if(near&&close<=near.hi*1.02&&d.slice(-6,-1).some(x=>+x.close>near.hi*1.01))pat="突破後回測";return{d,close,s1:below[0],s2:below[1],bp,r1:rr[0],r2:rr[1],vr,dist,m20,mup,pat,vol:+L.Trading_Volume/1000}}
const zone=z=>z?fmt(z.lo)+"–"+fmt(z.hi):"—";
async function scan(){let ids=$("symbols").value.split(",").map(x=>x.trim()).filter(Boolean),body=$("rows");body.innerHTML="";$("status").textContent="掃描 "+ids.length+" 檔…";let k=0;for(const id of ids)try{let a=calc(await get(id)),mf=$("maf").value;if(a.vol<+$("minVol").value||a.vr<+$("minVR").value||(a.dist!=null&&a.dist>+$("maxBP").value)||($("pat").value&&a.pat!==$("pat").value)||(mf==="up"&&!a.mup)||(mf==="down"&&a.mup))continue;k++;let why=a.bp?[...new Set(a.bp.reasons)].join("＋"):"—";body.insertAdjacentHTML("beforeend",`<tr onclick="openC('${id}')" style="cursor:pointer">
<td class="stockcell"><b>${id}　${NAMES[id]||""}</b></td>
<td data-label="現價">${fmt(a.close)}</td>
<td data-label="第一支撐 S1">${zone(a.s1)}</td>
<td data-label="第二支撐 S2">${zone(a.s2)}</td>
<td data-label="突破共振區 BP" class=bp>${zone(a.bp)}</td>
<td data-label="第一壓力 R1">${zone(a.r1)}</td>
<td data-label="第二壓力 R2">${zone(a.r2)}</td>
<td data-label="量比">${a.vr.toFixed(2)}×</td>
<td data-label="距突破區">${a.dist==null?"—":a.dist.toFixed(1)+"%"}</td>
<td data-label="20日均線 MA20" class=${a.mup?"up":"down"}>${fmt(a.m20)} ${a.mup?"↗":"↘"}</td>
<td data-label="型態"><span class=tag>${a.pat}</span></td>
<td data-label="共振原因" class=why>${why}</td></tr>`)}catch(e){body.insertAdjacentHTML("beforeend",`<tr><td>${id}</td><td colspan=11>${e.message}</td></tr>`)}$("status").textContent="完成："+k+" 檔符合條件。點股票看K線技術區。"}
function openC(id){$("chartId").value=id;tab("chart");chartLoad()}async function chartLoad(){let id=$("chartId").value.trim(),a=calc(await get(id));$("ctitle").innerHTML=`<b>${id}　${NAMES[id]||''}</b>　現價 ${fmt(a.close)}　<span class=tag>${a.pat}</span>`;$("kpis").innerHTML=[["第一支撐 S1",a.s1],["第二支撐 S2",a.s2],["突破共振 BP",a.bp],["第一壓力 R1",a.r1],["第二壓力 R2",a.r2]].map(([n,z])=>`<div class=kpi><span class=muted>${n}</span><b>${zone(z)}</b></div>`).join("");$("cwhy").textContent=`量比 ${a.vr.toFixed(2)}×｜MA20 ${fmt(a.m20)} ${a.mup?"↗":"↘"}｜BP共振：${a.bp?[...new Set(a.bp.reasons)].join("＋"):"尚無"}`;draw(a)}
function draw(a){let c=$("cv"),x=c.getContext("2d"),d=a.d.slice(-80),W=c.width,H=c.height,pad=48,vals=d.flatMap(q=>[+q.max,+q.min]);[a.s1,a.s2,a.bp,a.r1,a.r2].filter(Boolean).forEach(z=>vals.push(z.lo,z.hi));let lo=Math.min(...vals)*.98,hi=Math.max(...vals)*1.02,Y=p=>pad+(hi-p)/(hi-lo)*(H-pad*2),step=(W-pad*2)/d.length;x.clearRect(0,0,W,H);x.font="12px sans-serif";[[a.s1,"S1"],[a.s2,"S2"],[a.bp,"BP"],[a.r1,"R1"],[a.r2,"R2"]].forEach(([z,n])=>{if(!z)return;x.fillStyle=n==="BP"?"rgba(255,209,102,.18)":"rgba(98,167,255,.12)";x.fillRect(pad,Y(z.hi),W-pad*2,Y(z.lo)-Y(z.hi));x.fillStyle=n==="BP"?"#ffd166":"#9db0c9";x.fillText(n+" "+zone(z),pad+3,Y(z.hi)-3)});d.forEach((q,i)=>{let xx=pad+i*step+step/2,o=+q.open,cl=+q.close,h=+q.max,l=+q.min;x.strokeStyle=cl>=o?"#55d6a7":"#ff7b7b";x.fillStyle=x.strokeStyle;x.beginPath();x.moveTo(xx,Y(h));x.lineTo(xx,Y(l));x.stroke();x.fillRect(xx-step*.28,Math.min(Y(o),Y(cl)),step*.56,Math.max(2,Math.abs(Y(o)-Y(cl))))})}
</script></body></html>
